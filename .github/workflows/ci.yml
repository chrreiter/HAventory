name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel superseded runs on a PR; main/tag runs (empty head_ref) fall back to
# run_id and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The declared HA 2026.6.0 runtime. The source is 3.14-only (PEP 758
        # `except A, B:` syntax emitted by the 2026 ruff formatter).
        python-version: [ '3.14' ]
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Sync dev environment
        run: uv sync --python ${{ matrix.python-version }}
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Format (ruff format --check)
        # pre-commit enforces formatting only for local commits with hooks
        # installed; this step is the backstop for remote/hookless authors.
        run: uv run ruff format --check .
      - name: Types (mypy)
        run: uv run mypy
      - name: Test (pytest offline w/ coverage)
        run: >
          uv run pytest -q -p pytest_cov
          --cov=custom_components/haventory
          --cov-report=xml --cov-report=term-missing:skip-covered
          --junitxml=junit.xml
      - name: Backend coverage summary
        if: success() && hashFiles('coverage.xml') != ''
        run: |
          rate=$(uv run python -c "import xml.etree.ElementTree as ET; r=ET.parse('coverage.xml').getroot(); print(f\"{100*float(r.get('line-rate',0)):.2f}\")")
          echo "Backend coverage (py${{ matrix.python-version }}): ${rate}%" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload backend artifacts
        uses: actions/upload-artifact@v7
        with:
          name: backend-artifacts-py${{ matrix.python-version }}
          path: |
            coverage.xml
            junit.xml

  integration:
    # Second, separate test mode: runs the integration inside a REAL in-process
    # Home Assistant core (pytest-homeassistant-custom-component) to catch drift
    # against real HA APIs the offline stubs can't see. Uses a dedicated
    # environment so the offline `.venv` stays HA-free, and keeps plugin autoload
    # ON (phacc must load) — note there is NO PYTEST_DISABLE_PLUGIN_AUTOLOAD here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
      - name: Install Python 3.14
        run: uv python install 3.14
      - name: Create integration environment (phacc + real HA core)
        run: |
          uv venv --python 3.14 .venv-integration
          uv pip install --python .venv-integration/bin/python -r requirements-integration.txt
      - name: Integration tests (in-process HA via phacc)
        # Autoload ON so phacc + its pytest-asyncio/aiohttp/socket stack load;
        # phacc requires pytest-asyncio's auto mode.
        run: >
          .venv-integration/bin/python -m pytest -q
          -o asyncio_mode=auto
          tests/integration
          --junitxml=integration-junit.xml
      - name: Upload integration artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-artifacts
          path: integration-junit.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cards/haventory-card
    strategy:
      fail-fast: false
      matrix:
        # 24 = active LTS (primary); 22 = maintenance LTS floor.
        node-version: [ '22', '24' ]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: cards/haventory-card/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Audit (npm advisories, high+)
        # The repository's Dependabot auto-triage rule dismisses development-scope
        # alerts, so the alert dashboard cannot be trusted to surface a vulnerable
        # dev dependency — this blocking step is where the lockfile is checked.
        # Kept explicit rather than folded into the install above, whose
        # `--no-audit` keeps install output free of advisory noise.
        run: npm audit --audit-level=high
      - name: Lint
        run: npx eslint .
      - name: Types (tsc --noEmit)
        # The build below cannot catch this: Vite transpiles through esbuild,
        # which strips types without checking them.
        run: npm run typecheck
      - name: Test (vitest w/ coverage)
        run: npx vitest run --coverage
      - name: Frontend coverage summary
        if: success() && hashFiles('cards/haventory-card/coverage/coverage-summary.json') != ''
        run: |
          node -e 'const fs=require("fs"); const s=require("./coverage/coverage-summary.json"); fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "Frontend coverage (node${{ matrix.node-version }}): " + s.total.lines.pct + "%\n");'
      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v7
        with:
          name: frontend-artifacts-node${{ matrix.node-version }}
          path: cards/haventory-card/coverage/**
      - name: Build
        run: npm run build

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Hassfest
        uses: home-assistant/actions/hassfest@e3fb68ebda13d88a0d695082f471ba2c83d025fb  # master (untagged upstream)
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa  # main (untagged upstream)
        with:
          category: integration
          ignore: brands
