name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel superseded runs on a PR; main/tag runs (empty head_ref) fall back to
# run_id and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The declared HA 2026.6.0 runtime. The source is 3.14-only (PEP 758
        # `except A, B:` syntax emitted by the 2026 ruff formatter).
        python-version: [ '3.14' ]
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Sync dev environment
        run: uv sync --python ${{ matrix.python-version }}
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Format (ruff format --check)
        # Backstop for authors without the pre-commit hooks installed.
        run: uv run ruff format --check .
      - name: Types (mypy)
        run: uv run mypy
      - name: Test (pytest offline w/ coverage)
        run: >
          uv run pytest -q -p pytest_cov
          --cov=custom_components/haventory
          --cov-report=xml --cov-report=term-missing:skip-covered
          --junitxml=junit.xml
      - name: Backend coverage summary
        if: success() && hashFiles('coverage.xml') != ''
        run: |
          rate=$(uv run python -c "import xml.etree.ElementTree as ET; r=ET.parse('coverage.xml').getroot(); print(f\"{100*float(r.get('line-rate',0)):.2f}\")")
          echo "Backend coverage (py${{ matrix.python-version }}): ${rate}%" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload backend artifacts
        uses: actions/upload-artifact@v7
        with:
          name: backend-artifacts-py${{ matrix.python-version }}
          path: |
            coverage.xml
            junit.xml

  integration:
    # Runs in a real HA core in a separate venv; plugin autoload stays ON because
    # phacc must load, so there is no PYTEST_DISABLE_PLUGIN_AUTOLOAD here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
      - name: Install Python 3.14
        run: uv python install 3.14
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cards/haventory-card/package-lock.json
      - name: Build the card the integration serves
        # The bundle is git-ignored; without it the frontend tests skip instead of run.
        run: npm ci --no-audit --no-fund && npm run build
        working-directory: cards/haventory-card
      - name: Create integration environment (phacc + real HA core)
        run: |
          uv venv --python 3.14 .venv-integration
          uv pip install --python .venv-integration/bin/python -r requirements-integration.txt
      - name: Integration tests (in-process HA via phacc)
        # phacc requires pytest-asyncio's auto mode.
        run: >
          .venv-integration/bin/python -m pytest -q
          -o asyncio_mode=auto
          tests/integration
          --junitxml=integration-junit.xml
      - name: Upload integration artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-artifacts
          path: integration-junit.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cards/haventory-card
    strategy:
      fail-fast: false
      matrix:
        # 24 = active LTS (primary); 22 = maintenance LTS floor.
        node-version: [ '22', '24' ]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: cards/haventory-card/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Audit (npm advisories, moderate+)
        # Dependabot's auto-triage dismisses development-scope alerts, so this
        # step is the only place a vulnerable dev dependency surfaces; moderate
        # because a moderate one would be dismissed there too.
        run: npm audit --audit-level=moderate
      - name: Lint
        run: npx eslint .
      - name: Types (tsc --noEmit)
        # The build does not check types: Vite's esbuild only strips them.
        run: npm run typecheck
      - name: Test (vitest w/ coverage)
        run: npx vitest run --coverage
      - name: Frontend coverage summary
        if: success() && hashFiles('cards/haventory-card/coverage/coverage-summary.json') != ''
        run: |
          node -e 'const fs=require("fs"); const s=require("./coverage/coverage-summary.json"); fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "Frontend coverage (node${{ matrix.node-version }}): " + s.total.lines.pct + "%\n");'
      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v7
        with:
          name: frontend-artifacts-node${{ matrix.node-version }}
          path: cards/haventory-card/coverage/**
      - name: Build
        run: npm run build

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
      - name: Sync dev environment
        run: uv sync
      - name: actionlint
        # Runs the hook so the `.pre-commit-config.yaml` rev stays the one copy of
        # the actionlint version; `tests/test_toolchain_pins.py` holds the job to it.
        run: uv run pre-commit run actionlint --all-files --color always

  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Hassfest
        uses: home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3  # master (untagged upstream)
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa  # main (untagged upstream)
        with:
          category: integration
          ignore: brands
