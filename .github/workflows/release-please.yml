name: release-please

# Keeps a release PR open as conventional commits land on main; merging it tags
# the release, attaches the HACS zip and publishes. See CONTRIBUTING.md → Releases.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The tag is the one version release-please writes outside a file. It is
      # checked here, not from a `push: tags:` workflow, because GitHub starts no
      # workflow runs for events raised by GITHUB_TOKEN. The file-to-file half runs
      # in the backend job (tests/test_release_version_consistency.py).
      - name: Check out the published tag
        if: steps.release.outputs.release_created == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag_name }}

      - name: Tag matches the declared version
        if: steps.release.outputs.release_created == 'true'
        run: python3 scripts/check_version_consistency.py --tag "$TAG"
        env:
          TAG: ${{ steps.release.outputs.tag_name }}

      # Everything below builds the asset HACS installs: with `zip_release` it reads
      # only the asset named in hacs.json, and the card bundle is git-ignored. Built
      # here for the same GITHUB_TOKEN reason as the tag check.
      - name: Set up Node
        if: steps.release.outputs.release_created == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cards/haventory-card/package-lock.json

      - name: Build the card
        if: steps.release.outputs.release_created == 'true'
        run: npm ci --no-audit --no-fund && npm run build
        working-directory: cards/haventory-card

      - name: Package the integration
        if: steps.release.outputs.release_created == 'true'
        # Zipped from inside the integration directory: HACS strips no prefix, so
        # extra nesting installs an empty integration and reports success.
        run: |
          (cd custom_components/haventory && zip -r ../../haventory.zip . -x '*__pycache__*')
          unzip -l haventory.zip
          python3 scripts/check_release_zip.py haventory.zip

      - name: Attach the asset, then publish the release
        if: steps.release.outputs.release_created == 'true'
        # The release is a draft (release-please-config.json) and HACS skips drafts,
        # so it becomes installable only once the asset is attached. The tag exists
        # because `force-tag-creation` pushes it; a draft alone creates none.
        run: |
          gh release upload "$TAG" haventory.zip --clobber
          gh release edit "$TAG" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag_name }}
