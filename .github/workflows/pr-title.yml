name: pr-title

# Enforce Conventional Commit PR titles (the input release-please consumes).
#
# `pull_request`, not `pull_request_target`: GitHub creates no
# `pull_request_target` run for release-please's own PR, so the required status
# would never report and that PR could never merge. `labeler.yml` keeps
# `pull_request_target` because labelling a fork's PR needs a write token.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50  # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
