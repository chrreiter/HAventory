name: codeql

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "18 3 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [ "python", "javascript-typescript" ]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: github/codeql-action/init@c54b30b7df092240050e69945842bc67aee0f0f4  # v4.37.3
        with:
          languages: ${{ matrix.language }}

      - name: Install frontend deps
        if: matrix.language == 'javascript-typescript' && hashFiles('cards/haventory-card/package.json') != ''
        working-directory: cards/haventory-card
        run: npm ci --no-audit --no-fund

      - uses: github/codeql-action/analyze@c54b30b7df092240050e69945842bc67aee0f0f4  # v4.37.3
