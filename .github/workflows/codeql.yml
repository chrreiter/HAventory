name: codeql

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "18 3 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [ "python", "javascript-typescript" ]
    steps:
      - uses: actions/checkout@v7

      # The extractor resolves imports and the stdlib against whatever `python3`
      # is on PATH — its log shows it skipping built-ins out of this
      # interpreter's lib directory — so the pin decides which Python CodeQL
      # models the source against.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3  # v4.37.6
        with:
          languages: ${{ matrix.language }}

      - name: Install frontend deps
        if: matrix.language == 'javascript-typescript' && hashFiles('cards/haventory-card/package.json') != ''
        working-directory: cards/haventory-card
        run: npm ci --no-audit --no-fund

      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3  # v4.37.6
