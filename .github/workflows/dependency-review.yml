name: dependency-review

# Scan PRs for vulnerable or newly-introduced dependencies.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          comment-summary-in-pr: on-failure
