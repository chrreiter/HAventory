# Labels-as-code. Synced by .github/workflows/labels.yml (skip-delete: true, so
# labels not listed here are never removed). Add/rename here, not in the UI.

# --- Type ---
- name: "bug"
  color: "d73a4a"
  description: "Something isn't working"
- name: "enhancement"
  color: "a2eeef"
  description: "New feature or request"
- name: "documentation"
  color: "0075ca"
  description: "Improvements or additions to documentation"
- name: "question"
  color: "d876e3"
  description: "Further information is requested"

# --- Area ---
- name: "area:backend"
  color: "1d76db"
  description: "Integration / WebSocket API / storage"
- name: "area:card"
  color: "5319e7"
  description: "Lovelace card (frontend)"
- name: "area:ci"
  color: "c5def5"
  description: "CI, workflows, tooling"
- name: "area:docs"
  color: "bfd4f2"
  description: "Documentation and READMEs"

# --- Priority ---
- name: "priority:high"
  color: "b60205"
  description: "Should be addressed soon"
- name: "priority:medium"
  color: "fbca04"
  description: "Normal priority"
- name: "priority:low"
  color: "0e8a16"
  description: "Nice to have"

# --- Housekeeping ---
- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers"
- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed"
- name: "wontfix"
  color: "ffffff"
  description: "This will not be worked on"
- name: "duplicate"
  color: "cfd3d7"
  description: "This issue or pull request already exists"

# --- Dependencies (also created by Dependabot) ---
- name: "dependencies"
  color: "0366d6"
  description: "Pull requests that update a dependency file"
- name: "python"
  color: "2b67c6"
  description: "Python dependency updates"
- name: "javascript"
  color: "f1e05a"
  description: "JavaScript / card dependency updates"
- name: "github_actions"
  color: "000000"
  description: "GitHub Actions dependency updates"
