version: 2
updates:
  # GitHub Actions — group all bumps into one PR (keeps SHA-pinned + tagged
  # actions moving together).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  # Frontend card (npm). Group minor/patch; majors still arrive individually.
  - package-ecosystem: "npm"
    directory: "/cards/haventory-card"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      card-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Python dev toolchain via uv (reads pyproject.toml + uv.lock; GA since
  # 2025-03). Group minor/patch; majors arrive individually.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      python-dev:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Integration test harness (pip): `requirements-integration.txt` at the root.
  # The dependency graph already scans that file, so an advisory in it alerts;
  # what was missing is the pull request that fixes it.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    ignore:
      # Not dependencies to keep current. `requirements-integration.txt` pins the
      # Home Assistant core to the floor `hacs.json` declares, so the in-process
      # suite runs the integration *at* the minimum it claims to support rather
      # than at whatever is newest, and the frontend wheel is whatever that
      # release's own `frontend` manifest asks for. Two tests hold them there —
      # tests/test_min_ha_version.py and tests/integration/test_frontend.py — so
      # a bump arrives as a red pull request that reopens every week. Both move
      # together, by hand, when the declared floor moves.
      #
      # Scoped to version updates rather than ignored outright: a security update
      # for either must still be able to open a pull request.
      - dependency-name: "homeassistant"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "home-assistant-frontend"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
