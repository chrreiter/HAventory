version: 2

multi-ecosystem-groups:
  # The ruff pin in the `dev` group and the pre-commit hook rev are two copies
  # that tests/test_toolchain_pins.py holds equal, so the `uv` and `pre-commit`
  # updaters must move them in one pull request. Majors arrive individually.
  python-dev:
    schedule:
      interval: "weekly"
    update-types: ["minor", "patch"]

updates:
  # GitHub Actions: one PR for all bumps.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  # Frontend card (npm). Group minor/patch; majors still arrive individually.
  - package-ecosystem: "npm"
    directory: "/cards/haventory-card"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    ignore:
      # Two majors the surrounding toolchain refuses.
      # typescript 7: `@typescript-eslint` peer-requires `typescript <6.1.0`, so
      # `npm ci` fails to resolve; lift when typescript-eslint supports 7.
      # @types/node 26: describes a runtime newer than `engines` and the 22/24 CI
      # matrix; lift with a deliberate Node-floor bump.
      # Majors only, so minor, patch and security updates still open pull requests.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    groups:
      card-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Python dev toolchain via uv (pyproject.toml + uv.lock).
  - package-ecosystem: "uv"
    directory: "/"
    multi-ecosystem-group: "python-dev"
    patterns: ["*"]
    cooldown:
      default-days: 3
    exclude-paths:
      # `requirements-dev.txt` is `uv export` written down, not a manifest: bumping
      # its pins directly resolves nothing against `uv.lock`.
      # scripts/export_dev_requirements.sh rewrites it from the lock, and
      # tests/test_toolchain_pins.py fails while the two disagree. Security
      # advisories can still open a pull request.
      - "requirements-dev.txt"
    ignore:
      # `requirements-integration.txt` pins HA to the floor `hacs.json` declares and
      # the frontend wheel to that release's own manifest
      # (tests/test_min_ha_version.py, tests/integration/test_frontend.py); both
      # move by hand with the floor. Also set on `pip` below because this updater
      # reads that file too. Version updates only, so security updates still open.
      - dependency-name: "homeassistant"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "home-assistant-frontend"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"

  # pre-commit hook revs (.pre-commit-config.yaml); the actionlint rev is also
  # the only copy of that version, since CI runs the hook.
  - package-ecosystem: "pre-commit"
    directory: "/"
    multi-ecosystem-group: "python-dev"
    patterns: ["*"]
    cooldown:
      default-days: 3

  # The dev container's images: only `FROM` lines are read, which
  # tests/test_repo_hardening_offline.py enforces.
  - package-ecosystem: "docker"
    directory: "/.devcontainer"
    schedule:
      interval: "weekly"
    groups:
      devcontainer-images:
        patterns: ["*"]

  # The dev container's features (.devcontainer/devcontainer.json).
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"

  # Integration test harness (pip): `requirements-integration.txt` at the root.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    exclude-paths:
      # The two files the `uv` block owns: a pip edit would leave `uv.lock`
      # behind. Security advisories in either can still open a pull request here.
      - "pyproject.toml"
      - "requirements-dev.txt"
    ignore:
      # The same two pins as the `uv` block above.
      - dependency-name: "homeassistant"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "home-assistant-frontend"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
