repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        args:
          # "batery" and "categorie" are typos the tests feed in on purpose.
          # "afterall" is vitest's `afterAll`; "socio-economic" is the Contributor
          # Covenant's spelling, quoted verbatim; "statics" is a card class's
          # `static` members; "crate" is one of the mark's three boxes.
          - --ignore-words-list=hass,batery,afterall,socio-economic,statics,crate,categorie
        exclude: |
          (?x)^(
            custom_components/haventory/www/|
            cards/haventory-card/package-lock\.json|
            # Non-English dictionaries are all false positives ("ist", "sie",
            # "oder"); the English originals stay in scope.
            custom_components/haventory/translations/(?!en\.json)|
            cards/haventory-card/src/i18n/(?!en\.ts)
          )
        additional_dependencies: ["tomli"]
  # The card's half of the gate: both tools take the package rather than a file
  # list, and run the npm binaries already installed. Vitest stays out because a
  # full card suite on every commit invites `--no-verify`.
  - repo: local
    hooks:
      - id: card-eslint
        name: eslint (card)
        entry: bash -c 'cd cards/haventory-card && npx eslint .'
        language: system
        pass_filenames: false
        files: ^cards/haventory-card/
      - id: card-typecheck
        name: tsc --noEmit (card)
        entry: bash -c 'cd cards/haventory-card && npm run typecheck'
        language: system
        pass_filenames: false
        files: ^cards/haventory-card/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
        # `dev/ha_config_for_dev.yaml` uses Home Assistant's `!include` tag, which a generic loader rejects.
        args: [--unsafe]
      - id: end-of-file-fixer
        exclude: |
          (?x)^(
            custom_components/haventory/www/
          )
      - id: trailing-whitespace
        exclude: |
          (?x)^(
            custom_components/haventory/www/
          )
