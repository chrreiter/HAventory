repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        args:
          # "batery" is deliberate: it is the typo'd tag the organize dialog's
          # merge suggestion is tested against. "afterall" is Vitest's `afterAll`
          # hook, which prose about the test suite names.
          - --ignore-words-list=hass,batery,afterall
        exclude: |
          (?x)^(
            custom_components/haventory/www/|
            cards/haventory-card/package-lock\.json
          )
        additional_dependencies: ["tomli"]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: |
          (?x)^(
            custom_components/haventory/www/
          )
      - id: trailing-whitespace
        exclude: |
          (?x)^(
            custom_components/haventory/www/
          )
