repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        args:
          # "batery" is deliberate: it is the typo'd tag the organize dialog's
          # merge suggestion is tested against. "afterall" is vitest's teardown
          # hook `afterAll`, which the tracker names. "socio-economic" is the
          # Contributor Covenant's spelling, and CODE_OF_CONDUCT.md quotes that
          # document verbatim so it stays checkable against the original.
          # "statics" is the plural of a class's `static` members, which is what
          # Home Assistant reads a card's picker interface off. "crate" is one of
          # the three boxes the mark draws, named that in the icon geometry and in
          # everything that reads it. "categorie" is deliberate too: it is the
          # near-miss filter key `distinct_values` is asked to refuse by name.
          - --ignore-words-list=hass,batery,afterall,socio-economic,statics,crate,categorie
        exclude: |
          (?x)^(
            custom_components/haventory/www/|
            cards/haventory-card/package-lock\.json|
            # A dictionary for a language other than English is not English
            # prose, and every word in it is a false positive — "ist", "sie",
            # "oder" and "alle" are all real English typos and all ordinary
            # German. The English originals they are written against stay in
            # scope: `strings.json` and `i18n/en.ts` are still read.
            custom_components/haventory/translations/(?!en\.json)|
            cards/haventory-card/src/i18n/(?!en\.ts)
          )
        additional_dependencies: ["tomli"]
  # The card's half of the gate, run from the card package because that is where
  # its node_modules and config live. `pass_filenames: false` because both tools
  # take the package, not a file list; `language: system` because the hooks run
  # the npm binaries this checkout already installed rather than an environment
  # pre-commit builds. Vitest deliberately stays out: a full card suite on every
  # commit is what makes people reach for `--no-verify`, and CI plus
  # `scripts/ci_local.sh` already run it.
  - repo: local
    hooks:
      - id: card-eslint
        name: eslint (card)
        entry: bash -c 'cd cards/haventory-card && npx eslint .'
        language: system
        pass_filenames: false
        files: ^cards/haventory-card/
      - id: card-typecheck
        name: tsc --noEmit (card)
        entry: bash -c 'cd cards/haventory-card && npm run typecheck'
        language: system
        pass_filenames: false
        files: ^cards/haventory-card/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
        # Syntax only. `dev/ha_config_for_dev.yaml` uses Home Assistant's `!include`
        # tag, which a generic loader has no constructor for and rejects as a parse
        # error rather than as bad YAML.
        args: [--unsafe]
      - id: end-of-file-fixer
        exclude: |
          (?x)^(
            custom_components/haventory/www/
          )
      - id: trailing-whitespace
        exclude: |
          (?x)^(
            custom_components/haventory/www/
          )
