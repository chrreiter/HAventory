item_create:
  fields:
    name:
      required: true
      example: "Hammer"
      selector:
        text:
    description:
      required: false
      example: "16 oz claw hammer"
      selector:
        text:
    quantity:
      required: false
      example: 1
      selector:
        number:
    status:
      required: false
      example: "ok"
      selector:
        select:
          # The built-ins are suggestions, not the whole vocabulary: a household
          # defines its own statuses and Home Assistant cannot make a selector's
          # options dynamic. The backend validates the slug against the live set
          # either way.
          custom_value: true
          options:
            - "ok"
            - "missing"
            - "needs_repair"
    checked_out:
      required: false
      example: false
      selector:
        boolean:
    due_date:
      required: false
      example: "2025-01-01"
      selector:
        date:
    inspection_date:
      required: false
      example: "2025-06-01"
      selector:
        date:
    reminder_date:
      required: false
      example: "2025-09-01"
      selector:
        date:
    reminder_interval:
      required: false
      # How often the reminder repeats, as {unit, count} — unit is days, weeks
      # or months. Leave it out for a one-off date.
      example: {"unit": "months", "count": 3}
      selector:
        object:
    location_id:
      required: false
      example: "uuid-of-location"
      selector:
        text:
    tags:
      required: false
      example: ["tool", "garage"]
      # A list of strings, which is what `item_update` declares for the same
      # field: a text box would hand the schema a bare string.
      selector:
        object:
    category:
      required: false
      example: "tools"
      selector:
        text:
    low_stock_threshold:
      required: false
      example: 1
      selector:
        number:
    custom_fields:
      required: false
      example: {"sku": "A-1"}
      selector:
        object:

