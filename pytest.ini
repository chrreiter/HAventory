[pytest]
# HAventory has two backend test modes that share this config (see
# tests/conftest.py and tests/integration/):
#
#   * Offline (fast, default): Home Assistant is stubbed. Invoke with autoload
#     OFF, which by itself prevents any third-party plugin (phacc, pytest-socket)
#     from loading:
#         PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest -q
#
#   * Integration (opt-in): a real in-process Home Assistant core provided by
#     pytest-homeassistant-custom-component (phacc). Invoke with autoload ON so
#     phacc and its pytest-asyncio/pytest-aiohttp/pytest-socket stack load:
#         pytest -o asyncio_mode=auto tests/integration
#
# We deliberately keep NO `-p no:...` plugin-disable flags and NO `asyncio_mode`
# here. Under the offline invocation autoload is already off, so those flags were
# no-ops; forcing them globally would instead break the integration mode, which
# needs phacc + pytest-socket + pytest-asyncio's auto mode. Offline IDE runs
# (autoload on, HA absent) still work: tests/conftest.py installs the stubs and
# re-enables sockets defensively.

# Markers
markers =
    online: marks tests that perform real HTTP calls (set RUN_ONLINE=1)
    asyncio: mark a test as an asyncio-based test (pytest-asyncio)
    integration: marks tests that require a real in-process Home Assistant (phacc)

# asyncio_mode is intentionally unset globally: the offline suite marks async
# tests explicitly (@pytest.mark.asyncio) and the integration suite passes
# `-o asyncio_mode=auto` on the command line (phacc requires auto mode).
