[pytest]
# Two test modes share this config:
#   offline (HA stubbed, autoload off):  PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest -q
#   integration (real HA, autoload on):  pytest -o asyncio_mode=auto tests/integration
# No `-p no:...` flags or `asyncio_mode` here: they would break the integration
# mode, which needs phacc, pytest-socket and pytest-asyncio's auto mode.

# Markers
markers =
    online: marks tests that perform real HTTP calls (set RUN_ONLINE=1)
    asyncio: mark a test as an asyncio-based test (pytest-asyncio)
    integration: marks tests that require a real in-process Home Assistant (phacc)
    index_drift: the test leaves a repository index deliberately broken, so the
        autouse oracle in tests/conftest.py skips it
