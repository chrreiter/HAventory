[project]
name = "haventory"
version = "0.8.0"
description = "Home Assistant custom integration for household inventory tracking"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "chrreiter" }]
# Matches the declared HA runtime (min HA 2026.6.0 => Python 3.14.2), patch level
# included: that is the floor Home Assistant's own metadata states, so an
# interpreter this project accepts can install it. uv provisions the interpreter
# automatically (`uv sync` / `uv python install 3.14`); dev environments must
# allow that download or preinstall Python 3.14.
requires-python = ">=3.14.2"

[project.urls]
Homepage = "https://github.com/chrreiter/HAventory#readme"
Repository = "https://github.com/chrreiter/HAventory"
Issues = "https://github.com/chrreiter/HAventory/issues"
Changelog = "https://github.com/chrreiter/HAventory/releases"
Documentation = "https://github.com/chrreiter/HAventory/tree/main/docs"

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "ruff==0.16.4",
  "mypy",
  "pre-commit",
  "voluptuous",
  "aiohttp>=3.14.3",
  # tests/test_repo_hardening_offline.py parses .github/workflows/*.yml.
  "pyyaml",
]
# Not installed by `uv sync`, on purpose. `scripts/probe_fixtures.py` generates
# the attachment fixtures with Pillow and `scripts/probe_attachments.py` decodes
# what came back off Home Assistant's disk — but the integration does no image
# work server-side (nothing is thumbnailed, nothing is re-encoded), and the
# offline suite must keep running without an imaging library. Opt in with
# `uv sync --group probes` / `uv run --group probes …`.
probes = [
  "pillow",
]

[tool.uv]
# This is a custom-integration source tree, not a distributable package: HA loads
# `custom_components/haventory` directly. Don't build/install the project itself.
package = false

# py314 is the floor's series; ruff's target carries no patch level. Note: the
# 2026 formatter emits PEP 758 unparenthesized `except A, B:` at this target —
# the source is 3.14-only.
[tool.ruff]
target-version = "py314"
line-length = 100
respect-gitignore = true
src = [
  "custom_components/haventory",
  "scripts",
  "tests",
]
exclude = [
  "cards/**/node_modules",
  "cards/**/dist",
  "cards/**/www",
]

[tool.ruff.lint]
select = [
  "E", "F", "W",      # pycodestyle/pyflakes/warnings
  "I",                  # isort (import order)
  "UP",                 # pyupgrade
  "B",                  # flake8-bugbear
  "ASYNC",              # flake8-async
  "S",                  # flake8-bandit (security)
  "PL",                 # pylint subset
  "RUF",                # ruff rules
]
ignore = [
  "S101",  # allow assert in tests
]

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S110"]
# Dev/utility scripts legitimately do blocking IO and interactive input.
"scripts/**" = ["ASYNC240", "ASYNC250"]

[tool.mypy]
# python_version follows requires-python; mypy takes the series only
# (HA 2026.6.0 => Python 3.14).
python_version = "3.14"
files = ["custom_components/haventory"]
namespace_packages = true
explicit_package_bases = true
# stubs/ carries minimal local homeassistant .pyi stubs so the core modules
# type-check against real signatures even though HA is not installed offline.
mypy_path = "custom_components:stubs"
# Home Assistant modules not covered by stubs/ (and untyped deps such as
# voluptuous) resolve to Any rather than failing the run.
ignore_missing_imports = true
warn_redundant_casts = true

# The core modules are held to (per-module) strict mode; the rest of the
# integration stays at the non-strict baseline.
[[tool.mypy.overrides]]
module = [
  "haventory.models",
  "haventory.ops",
  "haventory.repository",
  "haventory.runtime",
  "haventory.serialization",
  "haventory.storage",
  "haventory.subscriptions",
  "haventory.ws",
]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true
