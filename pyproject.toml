[project]
name = "haventory"
version = "0.9.5"
description = "Home Assistant custom integration for household inventory tracking"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "chrreiter" }]
# Matches the declared HA runtime (min HA 2026.7.0 => Python 3.14.2), patch level
# included: that is the floor Home Assistant's own metadata states, so an
# interpreter this project accepts can install it. uv provisions the interpreter
# automatically (`uv sync` / `uv python install 3.14`); dev environments must
# allow that download or preinstall Python 3.14.
requires-python = ">=3.14.2"

[project.urls]
Homepage = "https://github.com/chrreiter/HAventory#readme"
Repository = "https://github.com/chrreiter/HAventory"
Issues = "https://github.com/chrreiter/HAventory/issues"
Changelog = "https://github.com/chrreiter/HAventory/releases"
Documentation = "https://github.com/chrreiter/HAventory/tree/main/docs"

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "ruff==0.16.10",
  "mypy",
  "pre-commit",
  "voluptuous",
  "aiohttp>=3.14.3",
  # tests/test_repo_hardening_offline.py parses .github/workflows/*.yml.
  "pyyaml",
]
# Not installed by `uv sync`, on purpose. `scripts/probe_fixtures.py` generates
# the attachment fixtures with Pillow and `scripts/probe_attachments.py` decodes
# what came back off Home Assistant's disk. `media.py` imports Pillow for its
# thumbnail tiles and serves the original wherever it cannot, so the integration
# installs without it and the offline suite runs without it.
# Opt in with `uv sync --group probes` / `uv run --group probes …`.
probes = [
  "pillow",
]

[tool.uv]
# This is a custom-integration source tree, not a distributable package: HA loads
# `custom_components/haventory` directly. Don't build/install the project itself.
package = false

# py314 is the floor's series; ruff's target carries no patch level. Note: the
# 2026 formatter emits PEP 758 unparenthesized `except A, B:` at this target —
# the source is 3.14-only.
[tool.ruff]
target-version = "py314"
line-length = 100
respect-gitignore = true
src = [
  "custom_components/haventory",
  "scripts",
  "tests",
]
exclude = [
  "cards/**/node_modules",
  "cards/**/dist",
  "cards/**/www",
]

[tool.ruff.lint]
select = [
  "E", "F", "W",      # pycodestyle/pyflakes/warnings
  "I",                  # isort (import order)
  "UP",                 # pyupgrade
  "B",                  # flake8-bugbear
  "ASYNC",              # flake8-async
  "S",                  # flake8-bandit (security)
  "PL",                 # pylint subset
  "RUF",                # ruff rules
]
ignore = [
  "S101",  # allow assert in tests
]

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S110"]
# Dev/utility scripts legitimately do blocking IO and interactive input.
"scripts/**" = ["ASYNC240", "ASYNC250"]

[tool.mypy]
# python_version follows requires-python; mypy takes the series only.
python_version = "3.14"
files = ["custom_components/haventory"]
namespace_packages = true
explicit_package_bases = true
mypy_path = "custom_components"
# Imports resolve against the in-process suite's environment, so the integration
# is checked against the real Home Assistant at the declared floor, with the
# aiohttp and voluptuous that release pins. `requirements-integration.txt` pins
# that environment to the hacs.json floor and nothing here repeats the number;
# `scripts/typecheck.sh` builds the environment and runs this.
python_executable = ".venv-integration/bin/python"
strict = true

# Home Assistant's component packages publish their API by importing it into
# `__init__.py` without `__all__` (`websocket_api.result_message`,
# `http.HomeAssistantView`), which is how its own components call it.
[[tool.mypy.overrides]]
module = ["homeassistant.*"]
implicit_reexport = true
