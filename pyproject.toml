[project]
name = "haventory"
version = "0.0.1"
description = "Home Assistant custom integration for household inventory tracking"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "chrreiter" }]
# Dev-tooling floor. The offline test suite is HA-stubbed and interpreter-agnostic,
# so it runs on 3.12+; the *shipped integration* targets Home Assistant 2026.7 /
# Python 3.14 (enforced by ruff `target-version`, mypy `python_version`, and CI).
requires-python = ">=3.12"

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "ruff==0.15.22",
  "mypy",
  "pre-commit",
  "voluptuous",
  "aiohttp>=3.9.1",
]

[tool.uv]
# This is a custom-integration source tree, not a distributable package: HA loads
# `custom_components/haventory` directly. Don't build/install the project itself.
package = false

# NOTE: `target-version` tracks the *source floor* the offline suite runs on
# (Python 3.12), NOT the declared HA runtime (2026.7 / Python 3.14). Bumping this
# to py314 makes ruff's formatter emit PEP 758 unparenthesized `except A, B:`,
# which is a SyntaxError on 3.12/3.13 and breaks the HA-stubbed offline suite on
# the dev floor. Follow-up: raise to py314 once the test floor drops 3.12/3.13.
[tool.ruff]
target-version = "py312"
line-length = 100
respect-gitignore = true
src = [
  "custom_components/haventory",
  "tests",
]
exclude = [
  "cards/**/node_modules",
  "cards/**/dist",
  "cards/**/www",
]

[tool.ruff.lint]
select = [
  "E", "F", "W",      # pycodestyle/pyflakes/warnings
  "I",                  # isort (import order)
  "UP",                 # pyupgrade
  "B",                  # flake8-bugbear
  "ASYNC",              # flake8-async
  "S",                  # flake8-bandit (security)
  "PL",                 # pylint subset
  "RUF",                # ruff rules
]
ignore = [
  "S101",  # allow assert in tests
]

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S110"]
# Dev/utility scripts legitimately do blocking IO and interactive input.
"scripts/**" = ["ASYNC240", "ASYNC250"]

[tool.mypy]
# Non-strict baseline: the current code passes. Strictness ratchets in WP4/WP5.
# python_version tracks the source floor (3.12), matching ruff `target-version`
# and requires-python; the integration also runs on the declared HA 3.14 runtime.
python_version = "3.12"
files = ["custom_components/haventory"]
namespace_packages = true
explicit_package_bases = true
mypy_path = "custom_components"
# Home Assistant is not installed in the offline dev env (it is stubbed for
# tests), so its imports are unresolved — don't fail on that at this stage.
ignore_missing_imports = true

# The WebSocket handlers (ws.py) and the repository's dynamic sort/relocation
# paths (repository.py) type-check against values pulled from the untyped WS
# envelope / cross-type sort keys. Their annotations are otherwise honoured;
# hardening these two boundaries is deferred to WP4/WP5 (Follow-up: type-harden
# ws.py + repository.py and drop this override).
[[tool.mypy.overrides]]
module = [
  "haventory.ws",
  "haventory.repository",
]
disable_error_code = [
  "arg-type",
  "attr-defined",
  "assignment",
  "index",
  "operator",
  "typeddict-item",
]
