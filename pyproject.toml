[project]
name = "haventory"
version = "0.0.1"
description = "Home Assistant custom integration for household inventory tracking"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "chrreiter" }]
# Matches the declared HA runtime (min HA 2026.7 => Python 3.14). uv provisions
# 3.14 automatically (`uv sync` / `uv python install 3.14`); dev environments
# must allow the interpreter download or preinstall 3.14.
requires-python = ">=3.14"

[project.urls]
Homepage = "https://github.com/chrreiter/HAventory#readme"
Repository = "https://github.com/chrreiter/HAventory"
Issues = "https://github.com/chrreiter/HAventory/issues"
Changelog = "https://github.com/chrreiter/HAventory/blob/main/CHANGELOG.md"
Documentation = "https://github.com/chrreiter/HAventory/tree/main/docs"

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "ruff==0.15.22",
  "mypy",
  "pre-commit",
  "voluptuous",
  "aiohttp>=3.9.1",
]

[tool.uv]
# This is a custom-integration source tree, not a distributable package: HA loads
# `custom_components/haventory` directly. Don't build/install the project itself.
package = false

# py314 matches requires-python. Note: the 2026 formatter emits PEP 758
# unparenthesized `except A, B:` at this target — the source is 3.14-only.
[tool.ruff]
target-version = "py314"
line-length = 100
respect-gitignore = true
src = [
  "custom_components/haventory",
  "tests",
]
exclude = [
  "cards/**/node_modules",
  "cards/**/dist",
  "cards/**/www",
]

[tool.ruff.lint]
select = [
  "E", "F", "W",      # pycodestyle/pyflakes/warnings
  "I",                  # isort (import order)
  "UP",                 # pyupgrade
  "B",                  # flake8-bugbear
  "ASYNC",              # flake8-async
  "S",                  # flake8-bandit (security)
  "PL",                 # pylint subset
  "RUF",                # ruff rules
]
ignore = [
  "S101",  # allow assert in tests
]

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S110"]
# Dev/utility scripts legitimately do blocking IO and interactive input.
"scripts/**" = ["ASYNC240", "ASYNC250"]

[tool.mypy]
# Non-strict baseline: the current code passes. Strictness ratchets in WP4/WP5.
# python_version matches requires-python / ruff target (HA 2026.7 => 3.14).
python_version = "3.14"
files = ["custom_components/haventory"]
namespace_packages = true
explicit_package_bases = true
mypy_path = "custom_components"
# Home Assistant is not installed in the offline dev env (it is stubbed for
# tests), so its imports are unresolved — don't fail on that at this stage.
ignore_missing_imports = true

# The WebSocket handlers (ws.py) and the repository's dynamic sort/relocation
# paths (repository.py) type-check against values pulled from the untyped WS
# envelope / cross-type sort keys. Their annotations are otherwise honoured;
# hardening these two boundaries is deferred to WP4/WP5 (Follow-up: type-harden
# ws.py + repository.py and drop this override).
[[tool.mypy.overrides]]
module = [
  "haventory.ws",
  "haventory.repository",
]
disable_error_code = [
  "arg-type",
  "attr-defined",
  "assignment",
  "index",
  "operator",
  "typeddict-item",
]
