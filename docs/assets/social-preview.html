<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>HAventory social preview</title>
    <!-- Roboto is Home Assistant's own typeface. Capturing this page needs
         network access, and the webfont has to have loaded before the shot or
         the fallback face is baked into the PNG. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Source for social-preview.png, which is this page captured at 2x.
         GitHub renders the social preview at 1280x640 and link unfurls in chat
         clients scale it down hard, hence the large type and the 80px margin. */
      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        width: 1280px;
        height: 640px;
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        gap: 56px;
        padding: 80px;
        background: #131e29;
        font-family: Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .glow {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          760px 520px at 84% 12%,
          rgba(92, 161, 242, 0.16),
          transparent 68%
        );
        pointer-events: none;
      }

      .copy {
        position: relative;
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 22px;
      }

      h1 {
        font-size: 104px;
        font-weight: 300;
        line-height: 1;
        letter-spacing: -0.03em;
        color: #fff;
      }

      h1 b {
        font-weight: 700;
      }

      p {
        max-width: 700px;
        font-size: 30px;
        font-weight: 300;
        line-height: 1.3;
        color: #a9b8c5;
        text-wrap: pretty;
      }

      ul {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        /* Narrower than the column so the four pills wrap 2+2 instead of 3+1. */
        max-width: 580px;
        margin-top: 10px;
        padding: 0;
        list-style: none;
      }

      li {
        padding: 9px 20px 11px;
        border: 1px solid rgba(92, 161, 242, 0.34);
        border-radius: 999px;
        background: rgba(92, 161, 242, 0.1);
        color: #c9dcf0;
        font-size: 21px;
      }

      .meta {
        display: flex;
        align-items: center;
        gap: 11px;
        margin-top: 16px;
        font-family: 'Roboto Mono', monospace;
        font-size: 18px;
        letter-spacing: 0.01em;
        color: #7a8894;
      }

      .meta::before {
        content: '';
        flex: none;
        width: 9px;
        height: 9px;
        border-radius: 999px;
        background: #e9a63c;
      }

      .mark {
        position: relative;
        flex: none;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="glow" aria-hidden="true"></div>

    <div class="copy">
      <h1><b>HA</b>ventory</h1>
      <p>Household inventory tracking for Home&nbsp;Assistant</p>
      <ul>
        <li>Nested locations</li>
        <li>Quantities &amp; low stock</li>
        <li>Inspection dates</li>
        <li>Instant search</li>
      </ul>
      <div class="meta">custom integration · installs via HACS</div>
    </div>

    <svg class="mark" width="356" height="356" viewBox="0 0 512 512" aria-hidden="true">
      <!-- Wound for the fill-rule below: under evenodd an enclosed subpath is a
           hole whichever way it runs, so all seven run the same way. The card
           writes the same outline the other way round in
           cards/haventory-card/src/ui/brand-icon.ts, because ha-svg-icon leaves
           the nonzero default there and only a crate wound against the house
           cuts a hole in it. Neither spelling works under the other's rule.
           tests/test_brand_assets.py holds the two outlines to each other. -->
      <path
        fill="#5CA1F2"
        fill-rule="evenodd"
        d="M242.17,54.89 A22,22 0 0 1 269.83,54.89 L457.83,206.89 A22,22 0 0 1 466,224 L466,430 A22,22 0 0 1 444,452 L68,452 A22,22 0 0 1 46,430 L46,224 A22,22 0 0 1 54.17,206.89 Z M214,174 H298 A14,14 0 0 1 312,188 V264 A14,14 0 0 1 298,278 H214 A14,14 0 0 1 200,264 V188 A14,14 0 0 1 214,174 Z M148,294 H232 A14,14 0 0 1 246,308 V384 A14,14 0 0 1 232,398 H148 A14,14 0 0 1 134,384 V308 A14,14 0 0 1 148,294 Z M280,294 H364 A14,14 0 0 1 378,308 V384 A14,14 0 0 1 364,398 H280 A14,14 0 0 1 266,384 V308 A14,14 0 0 1 280,294 Z M237,202 H275 A9,9 0 0 1 275,220 H237 A9,9 0 0 1 237,202 Z M171,322 H209 A9,9 0 0 1 209,340 H171 A9,9 0 0 1 171,322 Z M303,322 H341 A9,9 0 0 1 341,340 H303 A9,9 0 0 1 303,322 Z"
      />
    </svg>
  </body>
</html>
